[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hybridanc"
version = "0.1.0"
description = "Software noise-control research and Python audio prototype"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "sounddevice>=0.5,<1",
  "matplotlib>=3.8,<4",
  "soundfile>=0.13,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
]

[project.scripts]
hybridanc = "prototype.python.main:main"
hybridanc-devices = "prototype.python.audio_devices:main"

[tool.setuptools]
packages = ["prototype", "prototype.python"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
branch = true
source = ["prototype/python"]

[tool.coverage.report]
show_missing = true
skip_covered = true
