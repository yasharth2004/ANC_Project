[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hybridanc"
version = "0.1.0"
description = "Software noise-control research and Python audio prototype"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "sounddevice>=0.5,<1",
  "matplotlib>=3.8,<4",
  "soundfile>=0.13,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
]

[project.scripts]
hybridanc = "prototype.python.main:main"
hybridanc-safety = "prototype.python.audio_safety:main"
hybridanc-devices = "prototype.python.audio_devices:main"
hybridanc-capture = "prototype.python.audio_capture:main"
hybridanc-playback = "prototype.python.audio_playback:main"
hybridanc-passthrough = "prototype.python.audio_passthrough:main"
hybridanc-latency = "prototype.python.latency_test:main"
hybridanc-noise = "prototype.python.noise_analyzer:main"
hybridanc-filters = "prototype.python.digital_filters:main"
hybridanc-suppress = "prototype.python.noise_suppression:main"
hybridanc-anc-lab = "prototype.python.anc_simulation:main"
hybridanc-lms = "prototype.python.lms:main"
hybridanc-nlms = "prototype.python.nlms:main"
hybridanc-secondary-path = "prototype.python.secondary_path:main"
hybridanc-fxlms = "prototype.python.fxlms:main"
hybridanc-anc-dashboard = "prototype.python.anc_comparison_dashboard:main"
hybridanc-physical-anc = "prototype.python.physical_anc_experiment:main"
hybridanc-anc-evaluation = "prototype.python.anc_evaluation:main"
hybridanc-engine = "prototype.python.backend_service:main"
hybridanc-stability = "prototype.python.audio_stability_test:main"

[tool.setuptools]
packages = [
  "core",
  "core.safety",
  "prototype",
  "prototype.python",
  "prototype.python.dsp",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
branch = true
source = ["prototype/python"]

[tool.coverage.report]
show_missing = true
skip_covered = true
